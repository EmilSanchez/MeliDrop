<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar - Gestor de Tienda</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<section class="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-mark">A</div>
      <div class="login-logo-text">
        Gestor de Tienda
        <span>Panel administrativo</span>
      </div>
    </div>

    <form id="loginForm" class="login-form">
      <label class="field">
        <span>Usuario</span>
        <input type="text" id="loginUser" placeholder="admin" required autocomplete="username">
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input type="password" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
      </label>

      <p id="loginError" class="login-error" hidden>Usuario o contraseña incorrectos.</p>

      <button type="submit" class="login-btn">Ingresar</button>
    </form>
  </div>
</section>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
